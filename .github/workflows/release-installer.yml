name: Build and attach Windows installer

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: windows-installer-${{ github.event.release.id }}
  cancel-in-progress: false

jobs:
  windows-installer:
    name: Windows x64 NSIS installer
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Check out the release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build the NSIS installer
        run: npm run tauri -- build --ci --bundles nsis -- --locked

      - name: Attach the installer to the existing release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          $tauriConfig = Get-Content -LiteralPath 'src-tauri/tauri.conf.json' -Raw | ConvertFrom-Json
          $installerName = "$($tauriConfig.productName)_$($tauriConfig.version)_x64-setup.exe"
          $installerPath = (Get-Item -LiteralPath (Join-Path 'src-tauri/target/release/bundle/nsis' $installerName) -ErrorAction Stop).FullName
          $stableInstallerPath = Join-Path (Split-Path $installerPath) 'necko7-cs2i-windows-x64-setup.exe'
          Copy-Item -LiteralPath $installerPath -Destination $stableInstallerPath
          gh release upload "$env:RELEASE_TAG" "$installerPath" "$stableInstallerPath" --repo "$env:RELEASE_REPOSITORY" --clobber
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to attach the installer to the release."
          }
